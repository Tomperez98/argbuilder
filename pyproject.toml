[project]
name = "argbuilder"
version = "0.1.0"
description = "Typed command-line parsing where definition bugs fail at once and user mistakes return values. No dependencies."
readme = "README.md"
authors = [
    { name = "Tomas Perez Alvarez", email = "tomasperezalvarez@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
