[project]
name = "argbuilder"
version = "1.1.0"
description = "Typed command-line parsing where definition bugs fail at once and user mistakes return values. No dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tomas Perez Alvarez", email = "tomasperezalvarez@gmail.com" }
]
keywords = ["cli", "command-line", "argument-parser", "argparse", "clap", "typed", "zero-dependency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/Tomperez98/argbuilder"
Repository = "https://github.com/Tomperez98/argbuilder"
Issues = "https://github.com/Tomperez98/argbuilder/issues"
Changelog = "https://github.com/Tomperez98/argbuilder/releases"

[dependency-groups]
dev = [
    "griffe>=2.3.2",
    "hypothesis>=6.168.1",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Keep collection on the real suite: mutmut's `mutants/` working copy contains a
# second `tests/` tree and its own conftest, which would collide otherwise.
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=term"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100

# Mutation testing (local; `mise run mutation`). Line and branch coverage say
# branch coverage say every arm *runs*; mutation says the assertions would
# *notice* if an arm changed. Scope is the whole package, minus the pure
# re-export module. `addopts=` drops the 100%-coverage gate for mutant runs —
# a mutant legitimately lowers coverage, and the gate would kill every mutant
# for the wrong reason, making the score meaningless.
[tool.mutmut]
source_paths = ["src/argbuilder"]
do_not_mutate = ["src/argbuilder/__init__.py"]
also_copy = ["examples/"]
pytest_add_cli_args = ["-o", "addopts=", "-p", "no:cacheprovider"]
