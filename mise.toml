[tasks.sync]
description = "Create the locked development environment"
run = "uv sync --locked"

[tasks.lint]
description = "Lint with ruff"
depends = ["sync"]
run = "uv run --no-sync ruff check"

[tasks.format]
description = "Check formatting with ruff"
depends = ["sync"]
run = "uv run --no-sync ruff format --check"

[tasks.typecheck]
description = "Type-check with ty"
depends = ["sync"]
run = "uv run --no-sync ty check"

[tasks.test]
description = "Run the test suite"
depends = ["sync"]
run = "uv run --no-sync pytest -q"

[tasks.build]
description = "Build the sdist and wheel (publishes nothing)"
depends = ["sync"]
run = "uv build"

[tasks.smoke]
description = "Install the built wheel into a clean venv and import it"
depends = ["build"]
run = "rm -rf .smoke && uv venv --quiet .smoke && uv pip install --quiet --python .smoke/bin/python dist/*.whl && .smoke/bin/python -c 'import argbuilder; print(argbuilder.__file__)'"

[tasks."ci:fast"]
description = "Fast checks, safe to run on every save"
depends = ["lint", "format", "typecheck"]

[tasks.ci]
description = "The full suite: the same command CI runs"
depends = ["ci:fast", "test", "smoke"]

[tasks.publish]
description = "Publish the artifacts already in dist/ (release job only)"
run = "uv publish --trusted-publishing always"
