[tasks.sync]
description = "Create the locked development environment"
run = "uv sync --locked"

[tasks.lint]
description = "Lint with ruff"
depends = ["sync"]
run = "uv run --no-sync ruff check"

[tasks.format]
description = "Check formatting with ruff"
depends = ["sync"]
run = "uv run --no-sync ruff format --check"

[tasks.typecheck]
description = "Type-check with ty"
depends = ["sync"]
run = "uv run --no-sync ty check"

[tasks.test]
description = "Run the test suite"
depends = ["sync"]
run = "uv run --no-sync pytest -q"

[tasks.mutation]
description = "Mutation-test the package (mutmut; local, informational)"
depends = ["sync"]
run = "uv run --no-sync mutmut run --max-children 4 && uv run --no-sync mutmut export-cicd-stats"

[tasks.build]
description = "Build the sdist and wheel (publishes nothing)"
depends = ["sync"]
run = "uv build --clear"

[tasks."dist:check"]
description = "Assert dist/ holds exactly this version's sdist and wheel"
depends = ["build"]
run = "uv run --no-project python scripts/release.py check-dist \"$(uv version --short)\""

[tasks.smoke]
description = "Install the built wheel into a clean venv; check its version and run the examples"
depends = ["dist:check"]
run = """
rm -rf .smoke
uv venv --quiet .smoke
uv pip install --quiet --python .smoke/bin/python dist/*.whl
.smoke/bin/python scripts/release.py smoke "$(uv version --short)" examples
"""

[tasks."ci:fast"]
description = "Fast checks, safe to run on every save"
depends = ["lint", "format", "typecheck"]

[tasks.ci]
description = "The full suite: the same command CI runs"
depends = ["ci:fast", "test", "smoke"]

[tasks."release:tag"]
description = "Tag the version on origin/main and push the tag, which starts the release"
run = "uv run --no-project python scripts/release.py tag"

[tasks.publish]
description = "Publish the artifacts already in dist/ (release job only); skips files PyPI already has"
run = "uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz"
