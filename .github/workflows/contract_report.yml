name: Contract report

# Posts the Contract job's verdict on the pull request: one comment, kept up
# to date, and a `contract: <label>` label (ship skill, CI.md rule 10).
#
# CI runs the pull request's code with a read-only token. This workflow holds
# the write token, so it runs only trusted code from main: it never checks out
# the pull request, and treats the report it downloads as untrusted data.
#
# The labels are information, not a gate: let "contract: unchanged" merge on
# green alone only after the specs have caught real bugs.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  post:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # download the report from the CI run
      issues: write # create the labels the first time
      pull-requests: write # comment and label
    steps:
      - name: Download the report
        id: report
        continue-on-error: true # CI stopped before the Contract job wrote one
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contract-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment and label
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # Untrusted input: accept only the shapes we expect.
          pr="$(cat report/pr 2>/dev/null || true)"
          label="$(cat report/label 2>/dev/null || true)"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::report names no pull request"
            exit 1
          fi
          case "$label" in
            unchanged | additive | changed | breaking) ;;
            *) echo "::error::unknown label '$label'"; exit 1 ;;
          esac
          # The report must describe the pull request's current head; an
          # older run finishing late must not overwrite a newer verdict.
          head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "report is for ${HEAD_SHA::7}, pull request #$pr is at ${head::7}; skipping"
            exit 0
          fi

          marker='<!-- contract-report -->'
          {
            echo "$marker"
            # Break @mentions the pull request's spec could smuggle in.
            head -c 60000 report/summary.md | sed 's/@/@\xe2\x80\x8b/g'
            echo
            echo "<sub>Commit ${HEAD_SHA::7} · [CI run]($RUN_URL)</sub>"
          } > body.md
          comment="$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")"
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment" -F body=@body.md > /dev/null
          else
            gh pr comment "$pr" --body-file body.md
          fi

          gh label create "contract: unchanged" --force --color 0e8a16 --description "No spec or schema change, previous release's contract green"
          gh label create "contract: additive" --force --color 1d76db --description "New promises only; one spec owner approves"
          gh label create "contract: changed" --force --color fbca04 --description "Promises reworded or removed, previous contract still green"
          gh label create "contract: breaking" --force --color d93f0b --description "The previous release's contract rejects this build"
          for other in unchanged additive changed breaking; do
            if [ "$other" != "$label" ]; then
              gh pr edit "$pr" --remove-label "contract: $other" 2>/dev/null || true
            fi
          done
          gh pr edit "$pr" --add-label "contract: $label"
