name: Release

# Publishing uses PyPI trusted publishing (OIDC), so no API token is stored.
# One-time setup on PyPI: add a trusted publisher with
#   owner: Tomperez98, repo: argbuilder, workflow: release.yml, environment: pypi
#
# Cut a release with:
#   git tag v0.2.0 && git push origin v0.2.0
# Manual runs must target the release tag so the version check below applies.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a release partway through, and never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/argbuilder
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so the lineage check below can find the merge base
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17" # keep in sync with mise.toml [tools]
          enable-cache: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: "false"

      # Preconditions: fail before any side effect, not halfway through.
      # (bugs panic; a registry/network failure is the only retryable kind)
      - name: Check the commit is on main
        run: |
          # Never publish a tag that points off mainline (e.g. a GitButler
          # workspace commit): the bytes should be a tested commit on main.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::tag commit $(git rev-parse --short HEAD) is not on main; refusing to publish"
            exit 1
          fi
      - name: Check the tag matches the pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version $version"
            exit 1
          fi
      - name: Check the version is not already on PyPI
        run: |
          version="$(uv version --short)"
          if curl -fsS "https://pypi.org/pypi/argbuilder/$version/json" > /dev/null; then
            echo "::error::argbuilder $version already exists on PyPI; versions are immutable"
            exit 1
          fi

      # Run the exact suite CI runs — including building and smoke-testing —
      # so a tag never publishes untested code. Publish only those bytes.
      - name: Run the full check suite
        run: mise run ci
      - name: Publish to PyPI
        run: mise run publish
