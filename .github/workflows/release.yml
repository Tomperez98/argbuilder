name: Release

# Publishing uses PyPI trusted publishing (OIDC), so no API token is stored.
# One-time setup on PyPI: add a trusted publisher with
#   owner: Tomperez98, repo: argbuilder, workflow: release.yml, environment: pypi
#
# Cut a release with:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/argbuilder
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check the tag matches the pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version $version"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish --trusted-publishing always
