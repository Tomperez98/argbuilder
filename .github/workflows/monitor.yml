name: Monitor

# Keep testing main after the gate (MONITOR.md): the full CI matrix runs
# weekly as well, so a new Python patch release, a runner image, or PyPI
# changing breaks the suite without a commit.
#
# A scheduled run blocks nothing and nobody is watching it, so its failure
# goes where someone will act on it (MONITOR.md rule 4): one tracking issue,
# updated while main stays red and closed when it's green again. One issue,
# not a red badge every week that people learn to ignore.
#
# This is deliberately separate from ci.yml. ci.yml is the reusable gate a
# release calls, and a called workflow's jobs may only use the permissions the
# caller grants; the tracking job needs `issues: write`, which the release must
# not hand to its test run. Splitting them keeps the gate at `contents: read`.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # Its own group: the called ci.yml has its own (per `github.ref`) and would
  # deadlock against itself if this run shared it.
  group: monitor
  cancel-in-progress: false

permissions: {}

jobs:
  # The same suite CI runs, on the same commit; ci.yml is the reusable gate.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  track:
    name: Track the scheduled run
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.ci.result != 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled CI is failing on main"
          issue="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ "$FAILED" = true ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Still failing: $RUN_URL"
            else
              gh issue create --title "$title" --body "$(printf '%s\n' \
                "The weekly run on main failed: $RUN_URL" "" \
                "Nothing in the repo changed, so something outside it did: a new Python," \
                "a runner image, PyPI. Fix it, or close this with the reason.")"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Green again: $RUN_URL"
          fi
